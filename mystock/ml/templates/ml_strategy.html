<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>预测区间挂单回溯 · myStock ML</title>
<style>
/* 浅色单主题：显式给底色，避免深色模式下借用宿主底色变成"深底深字" */
:root{color-scheme:light;--bg:#fff;--fg:#1c2024;--mut:#5b6470;--line:#e3e6ea;
  --panel:#f7f8fa;--up:#d33;--down:#127a3d;--blue:#2a6fd8}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);margin:0 auto;max-width:1000px;
  padding:28px 18px 64px;font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
h1{font-size:24px;margin:0 0 4px;letter-spacing:-.01em}
.sub{color:var(--mut);font-size:13px;margin:0 0 18px}
/* 控件条 */
.ctl{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;background:var(--panel);
  border-radius:10px;padding:14px 16px;margin-bottom:18px}
.fld{display:flex;flex-direction:column;gap:4px}
.fld label{font-size:11px;color:var(--mut);letter-spacing:.04em}
.fld input{font:14px/1.4 inherit;padding:7px 10px;border:1px solid var(--line);
  border-radius:6px;background:#fff;color:var(--fg);min-width:90px}
.fld input:focus-visible{outline:2px solid var(--blue);outline-offset:1px}
.fld.grow{flex:1 1 260px} .fld.grow input{width:100%}
button{font:600 14px/1.4 inherit;padding:8px 18px;border:none;border-radius:6px;
  background:var(--blue);color:#fff;cursor:pointer}
button:hover{background:#245fb8} button:disabled{opacity:.55;cursor:default}
button:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.hint{font-size:11.5px;color:var(--mut);width:100%;margin-top:2px}
/* tab */
.tabs{display:flex;gap:2px;border-bottom:1px solid var(--line);overflow-x:auto;margin-top:6px}
.tab{white-space:nowrap;padding:8px 13px;font-size:13px;color:var(--mut);cursor:pointer;
  border:1px solid transparent;border-bottom:none;border-radius:6px 6px 0 0;
  background:none;font-weight:400;position:relative;top:1px}
.tab:hover{background:var(--panel)}
.tab[aria-selected=true]{background:#fff;border-color:var(--line);color:var(--fg);
  font-weight:600;box-shadow:0 -2px 0 var(--blue) inset}
.tab .r{font-size:11px;margin-left:5px;font-variant-numeric:tabular-nums}
.panel{border:1px solid var(--line);border-top:none;border-radius:0 0 10px 10px;padding:16px}
/* 汇总条 */
.stats{display:flex;flex-wrap:wrap;gap:20px;background:var(--panel);border-radius:8px;
  padding:12px 16px;margin-bottom:14px}
.st{display:flex;flex-direction:column;gap:2px}
.st b{font-size:18px;font-variant-numeric:tabular-nums;line-height:1.2}
.st span{font-size:11px;color:var(--mut);letter-spacing:.03em}
.scroll{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13px;
  font-variant-numeric:tabular-nums;white-space:nowrap}
th{text-align:right;font-size:11px;color:var(--mut);letter-spacing:.04em;font-weight:600;
  border-bottom:1px solid var(--line);padding:6px 9px}
th:first-child{text-align:left}
td{text-align:right;padding:5px 9px;border-bottom:1px solid #f2f4f6}
td:first-child{text-align:left;color:var(--mut)}
tbody tr:last-child td{border-bottom:none}
.up{color:var(--up)} .down{color:var(--down)} .dim{color:#c9ced6}
.warn{border-left:3px solid var(--up);background:#fdf3f3;border-radius:0 8px 8px 0;
  padding:12px 16px;margin:16px 0;font-size:13.5px;line-height:1.7}
.note{color:var(--mut);font-size:12px;line-height:1.7;margin-top:12px}
.msg{padding:26px 0;text-align:center;color:var(--mut)}
.drift{margin:4px 0 14px} .dlab{font-size:11px;color:var(--mut)}
</style>
</head>
<body>
<h1>预测区间挂单回溯</h1>
<p class="sub">按每日预测区间挂单：<b class="down">下沿 L̂ 限价买</b> / <b class="up">上沿 Ĥ 限价卖</b>。
美股每次 10 股、港股每次 100 股。撮合走 1h K 线（可判盘中先触低还是先触高），假设现金与持仓充足。
<b>实时按数据库计算</b>——改参数即重算。</p>

<form class="ctl" id="f">
  <div class="fld grow">
    <label for="codes">标的（逗号分隔，富途代码）</label>
    <input id="codes" name="codes" value="{{ default_codes }}" autocomplete="off">
  </div>
  <div class="fld">
    <label for="days">回溯交易日</label>
    <input id="days" name="days" type="number" min="1" max="400" value="30">
  </div>
  <button type="submit" id="go">重新计算</button>
  <div class="hint">可选标的：US.NVDA / US.TSLA / US.PDD / HK.00700 / HK.09988 / HK.01810</div>
</form>

<div id="out"><div class="msg">加载中…</div></div>

<script>
const $ = s => document.querySelector(s);
const fmt = (v, nd = 2) => v === null || v === undefined
  ? '—' : v.toLocaleString('en-US', {minimumFractionDigits: nd, maximumFractionDigits: nd});
const sign = (v, nd = 2) => (v > 0 ? '+' : '') + fmt(v, nd);

/** 净持仓漂移折线：仓位单向漂移是这个策略最关键的风险，值得画出来。 */
function drift(rows) {
  const w = 700, h = 96, pad = 26;
  const ps = rows.map(r => r.pos);
  const lo = Math.min(0, ...ps), hi = Math.max(0, ...ps), rng = (hi - lo) || 1;
  const X = i => pad + (w - 2 * pad) * (i / Math.max(1, ps.length - 1));
  const Y = v => h - pad - (h - 2 * pad) * ((v - lo) / rng);
  const pts = ps.map((v, i) => `${X(i).toFixed(1)},${Y(v).toFixed(1)}`).join(' ');
  return `<svg viewBox="0 0 ${w} ${h}" style="width:100%;height:auto;font:10px sans-serif">
    <line x1="${pad}" y1="${Y(0).toFixed(1)}" x2="${w - pad}" y2="${Y(0).toFixed(1)}"
      stroke="#c9ced6" stroke-dasharray="3 3"/>
    <text x="${pad - 4}" y="${(Y(0) + 3).toFixed(1)}" text-anchor="end" fill="#9aa1ab">0</text>
    <text x="${pad - 4}" y="${(Y(hi) + 3).toFixed(1)}" text-anchor="end" fill="#9aa1ab">${hi}</text>
    <text x="${pad - 4}" y="${(Y(lo) + 3).toFixed(1)}" text-anchor="end" fill="#9aa1ab">${lo}</text>
    <polyline points="${pts}" fill="none" stroke="#5b6470" stroke-width="1.8"/>
  </svg>`;
}

function panel(r) {
  const s = r.summary, cur = r.currency;
  if (!r.n_days) return `<div class="msg">${r.code}：该窗口无可用数据（缺预测留档或 1h K 线）。</div>`;
  const body = r.rows.map(x => {
    const b = x.buy_price === null ? '<span class="dim">—</span>'
      : `<b class="down">${fmt(x.buy_price)}</b>`;
    const sl = x.sell_price === null ? '<span class="dim">—</span>'
      : `<b class="up">${fmt(x.sell_price)}</b>`;
    const pc = x.pos < 0 ? 'up' : (x.pos > 0 ? 'down' : 'dim');
    return `<tr><td>${x.date}</td><td>${fmt(x.l_hat)} ~ ${fmt(x.h_hat)}</td>
      <td>${fmt(x.low)} ~ ${fmt(x.high)}</td><td>${b}</td><td>${sl}</td>
      <td class="${pc}"><b>${x.pos > 0 ? '+' : ''}${x.pos}</b></td></tr>`;
  }).join('');
  const tc = s.total_pnl >= 0 ? 'up' : 'down';
  return `
    <div class="stats">
      <div class="st"><b class="${tc}">${sign(s.total_pnl)}</b><span>总盈亏 ${cur}</span></div>
      <div class="st"><b>${s.n_buy} / ${s.n_sell}</b><span>买成 / 卖成（天）</span></div>
      <div class="st"><b>${s.n_both}</b><span>双边成交（天）</span></div>
      <div class="st"><b>${sign(s.cash_flow)}</b><span>现金流净额</span></div>
      <div class="st"><b class="${s.end_pos < 0 ? 'up' : ''}">${s.end_pos > 0 ? '+' : ''}${s.end_pos} 股</b><span>期末净持仓</span></div>
      <div class="st"><b>${sign(s.mark_value)}</b><span>持仓折算 @${fmt(s.last_close)}</span></div>
    </div>
    <div class="drift"><div class="dlab">净持仓漂移（${s.min_pos} ~ ${s.max_pos} 股，每手 ${r.lot} 股）</div>${drift(r.rows)}</div>
    <div class="scroll"><table>
      <thead><tr><th>交易日</th><th>挂单 买L̂ ~ 卖Ĥ</th><th>实际 低~高</th>
        <th>买成交</th><th>卖成交</th><th>净持仓</th></tr></thead>
      <tbody>${body}</tbody></table></div>`;
}

let data = null, cur = 0;
function render() {
  if (!data) return;
  const rs = data.results;
  const tabs = rs.map((r, i) => {
    const t = r.summary.total_pnl;
    const cls = !r.n_days ? 'dim' : (t >= 0 ? 'up' : 'down');
    const val = r.n_days ? `<span class="r ${cls}">${sign(t, 0)}</span>` : '';
    return `<button type="button" class="tab" role="tab" data-i="${i}"
      aria-selected="${i === cur}">${r.code}${val}</button>`;
  }).join('');
  $('#out').innerHTML =
    `<div class="warn"><b>注意口径</b>：净持仓可为负（裸空）——只有在「持仓充足」假设下才成立。
       总盈亏 = 现金流净额（卖−买） + 期末净持仓按最后收盘折算。
       ${data.note}</div>
     <div class="tabs" role="tablist">${tabs}</div>
     <div class="panel">${panel(rs[cur])}</div>
     <p class="note">窗口 ${rs[cur].start || '—'} ~ ${rs[cur].end || '—'}，共 ${rs[cur].n_days} 个交易日。
       数据源：<code>ml_predictions</code> 留档预测 + <code>ml_quotes_1h</code> 盘中 K 线，实时按库计算。
       撮合规则同项目回测（<code>simulator.match_limit_order</code>）：限价买在首根 low ≤ L̂ 的 bar 成交、
       成交价 min(L̂, open)；限价卖在首根 high ≥ Ĥ 的 bar 成交、成交价 max(Ĥ, open)。
       本页为离线数据分析，不构成投资建议。</p>`;
  $('#out').querySelectorAll('.tab').forEach(b =>
    b.addEventListener('click', () => { cur = +b.dataset.i; render(); }));
}

async function load(ev) {
  if (ev) ev.preventDefault();
  $('#go').disabled = true;
  $('#out').innerHTML = '<div class="msg">计算中…</div>';
  const q = new URLSearchParams({codes: $('#codes').value, days: $('#days').value});
  try {
    const res = await fetch('/api/strategy?' + q);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    data = await res.json();
    cur = 0;
    render();
  } catch (e) {
    $('#out').innerHTML = `<div class="msg">计算失败：${e.message}。请确认服务与 ML 库可用。</div>`;
  } finally {
    $('#go').disabled = false;
  }
}
$('#f').addEventListener('submit', load);
load();
</script>
</body>
</html>
